services:
  api:
    build: .
    image: freeds/freeds-config:latest
    container_name: freeds-config
    expose:
      - 8005
    ports:
      - "127.0.0.1:8005:8005"
    environment:
      - FLASK_ENV=development
      - FREEDS_ROOT_PATH=/opt/freeds
      - FREEDS_CONFIGS_PATH=/opt/freeds/config/configs
      - FREEDS_LOCALS_PATH=/opt/freeds/config/locals
    volumes:
      - ${FREEDS_CONFIGS_PATH}:/opt/freeds/config/configs
      - ${FREEDS_LOCALS_PATH}:/opt/freeds/config/locals
    networks:
      - freeds-network

networks:
  freeds-network:
    name: freeds-network
    external: true
