services:
  api:
    build: .
    image: freeds/freeds-config:latest
    container_name: freeds-config
    expose:
      - 8005
    ports:
      - "127.0.0.1:8005:8005"
    environment:
      - FLASK_ENV=development
    volumes:
      - /opt/tfds/config:/opt/tfds/config
      - /opt/tfds/secrets:/opt/tfds/secrets
    networks:
      - freeds-network

networks:
  freeds-network:
    name: freeds-network
    external: true
