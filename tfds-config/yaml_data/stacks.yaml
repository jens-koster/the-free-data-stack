annotation: The stack definitions for tfds cli. tfds will do some magic and then iterate
  these folders in order to run docker compose with the chosen command in each
config:
  spark-stack:
    services:
    - tfds-config
    - s3-ninja
    - postgreSQL
    - spark
    - papermill
    - airflow
  x-stack:
    services:
    - tfds-config
    - s3-ninja
    - clickhouse
