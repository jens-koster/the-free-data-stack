doc: The stack definitions for tfds cli. tfds will do some magic and then iterate
  these folders in order to run docker compose with the chosen command in each

tfds_config:
  - noserve
  - noenv

config:
  spark-stack:
    services:
    - tfds-config
    - s3-minio
    - postgres
    - spark
    - papermill
    - redis
    - airflow
  book-runner:
    services:
    - tfds-config
    - s3-minio
    - papermill
  spark-mini:
    services:
    - tfds-config
    - s3-minio
    - postgres
    - spark
  airflow-mini:
    services:
    - tfds-config
    - s3-minio
    - postgres
    - papermill
    - redis
    - airflow
