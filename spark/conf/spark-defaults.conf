spark.app.name                          WhenDoIGetToSparkMyWay
spark.master                            spark://spark-master:7077

spark.driver.extraClassPath             /opt/freeds/spark/jars/*
spark.executor.extraClassPath           /opt/freeds/spark/jars/*


# Iceberg Spark extensions
spark.sql.extensions                         org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Configure JDBC catalog named 'freeds_cat'
spark.sql.catalog.freeds_cat                  org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.freeds_cat.type             jdbc
spark.sql.catalog.freeds_cat.uri              jdbc:postgresql://postgres:5432/iceberg
spark.sql.catalog.freeds_cat.warehouse        s3a://dwh/warehouse/

# s3 configs
spark.hadoop.fs.s3a.endpoint            http://s3-minio:9900
# path.style.access seems necessary for using minio
spark.hadoop.fs.s3a.path.style.access   true

# this makes the delta tables go to s3
spark.sql.warehouse.dir                 s3a://dwh/warehouse/

# default is 200 partitions, which apparently is a bit high for a local setup
spark.sql.shuffle.partitions            12
# the wikipedia pageview dataset would not go through on default level. we need a bit more memory.
spark.executor.memory                   2g

spark.signal.config.value               custom_config_file_found
